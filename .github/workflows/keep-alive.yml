name: Keep Streamlit App Alive

on:
  schedule:
    # Runs every 6 hours to stay well within 12-hour sleep threshold
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -s -o /dev/null -w "%{http_code}" ${{ secrets.STREAMLIT_APP_URL }} || true
          echo "Pinged app to keep it alive"
