name: Keep Streamlit App Alive

on:
  schedule:
    # Runs every 6 hours to stay within 12-hour sleep threshold
    - cron: '10 3 * * *'   # 9:10PM CT
    - cron: '10 9 * * *'   # 3:10AM CT
    - cron: '10 15 * * *'  # 9:10AM CT
    - cron: '10 21 * * *'  # 3:10PM CT
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Load Streamlit App with Headless Browser
        id: ping
        run: |
          python << 'EOF'
          import asyncio
          from playwright.async_api import async_playwright

          async def load_app():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page()

                  url = "${{ secrets.STREAMLIT_APP_URL }}"
                  print(f"Loading {url}...")

                  try:
                      # Navigate and wait for network to be idle (app fully loaded)
                      await page.goto(url, wait_until="networkidle", timeout=300000)

                      # Wait additional time for Streamlit to render
                      await page.wait_for_timeout(10000)

                      # Check if page has content
                      title = await page.title()
                      print(f"✅ App loaded successfully - Title: {title}")

                      # Take screenshot for debugging (optional)
                      await page.screenshot(path="/tmp/screenshot.png")
                      print("Screenshot saved to /tmp/screenshot.png")

                  except Exception as e:
                      print(f"❌ Failed to load app: {e}")
                      await browser.close()
                      exit(1)

                  await browser.close()
                  print("Browser closed successfully")

          asyncio.run(load_app())
          EOF

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshot
          path: /tmp/screenshot.png
          if-no-files-found: ignore
          retention-days: 1

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "⚠️ BookSpring Dashboard Keep-Alive Failed"
          to: yash.pargaonkar@gmail.com
          from: BookSpring Dashboard Monitor
          body: |
            The keep-alive ping for your Streamlit dashboard failed.

            The headless browser could not load the app.

            Check the workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
