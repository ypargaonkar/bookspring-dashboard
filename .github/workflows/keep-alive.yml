name: Keep Streamlit App Alive

on:
  schedule:
    # Runs at 8am and 8pm UTC daily
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -s -o /dev/null -w "%{http_code}" ${{ secrets.STREAMLIT_APP_URL }} || true
          echo "Pinged app to keep it alive"
