name: Keep Streamlit App Alive

on:
  schedule:
    # Runs every 6 hours, with 3:10AM CT ping (9:10 UTC) to ensure cache has expired
    # Cache expires at 3AM CT (9:00 UTC), ping at 3:10AM CT guarantees refresh
    - cron: '10 3 * * *'   # 9:10PM CT
    - cron: '10 9 * * *'   # 3:10AM CT - triggers cache refresh
    - cron: '10 15 * * *'  # 9:10AM CT
    - cron: '10 21 * * *'  # 3:10PM CT
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        id: ping
        run: |
          # Don't follow redirects (-L removed) - a 3xx response still means server is alive
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ secrets.STREAMLIT_APP_URL }}")
          echo "HTTP Status: $HTTP_CODE"
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          # Accept 2xx and 3xx as success (redirects mean server is responding)
          if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 400 ]]; then
            echo "✅ App is alive and responding"
          else
            echo "❌ App returned unexpected status: $HTTP_CODE"
            exit 1
          fi

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "⚠️ BookSpring Dashboard Keep-Alive Failed"
          to: yash.pargaonkar@gmail.com
          from: BookSpring Dashboard Monitor
          body: |
            The keep-alive ping for your Streamlit dashboard failed.

            HTTP Status: ${{ steps.ping.outputs.http_code }}
            Time: ${{ github.event.repository.updated_at }}

            Your app may go to sleep if not addressed.

            Check the workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
