name: Keep Streamlit App Alive

on:
  schedule:
    # Runs every 6 hours, aligned with 3AM CT (9AM UTC) for cache refresh
    # 9AM UTC = 3AM CT, 3PM UTC = 9AM CT, 9PM UTC = 3PM CT, 3AM UTC = 9PM CT
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        id: ping
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L ${{ secrets.STREAMLIT_APP_URL }})
          echo "HTTP Status: $HTTP_CODE"
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 400 ]]; then
            echo "✅ App is alive and responding"
          else
            echo "❌ App returned unexpected status: $HTTP_CODE"
            exit 1
          fi

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "⚠️ BookSpring Dashboard Keep-Alive Failed"
          to: yash.pargaonkar@gmail.com
          from: BookSpring Dashboard Monitor
          body: |
            The keep-alive ping for your Streamlit dashboard failed.

            HTTP Status: ${{ steps.ping.outputs.http_code }}
            Time: ${{ github.event.repository.updated_at }}

            Your app may go to sleep if not addressed.

            Check the workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
